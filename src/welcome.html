<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mark as Watched for YouTube</title>
    <link rel="icon" href="../icons/icon-32.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f9f9f9;
        --card: #fff;
        --text: #0f0f0f;
        --muted: #606060;
        --border: #e5e5e5;
        --ok: #188038;
        --warn: #d93025;
        --accent: #065fd4;
        --accent-text: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f0f;
          --card: #212121;
          --text: #f1f1f1;
          --muted: #aaa;
          --border: #3f3f3f;
          --ok: #81c995;
          --warn: #f28b82;
          --accent: #3ea6ff;
          --accent-text: #0f0f0f;
        }
      }
      body {
        margin: 0;
        padding: 48px 16px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.55 Roboto, Arial, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 28px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      header img {
        width: 48px;
        height: 48px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      #status {
        margin: 24px 0 8px;
        font-weight: 600;
      }
      #status.ok {
        color: var(--ok);
      }
      #status.missing {
        color: var(--warn);
      }
      #detail,
      #result {
        margin: 0 0 16px;
        color: var(--muted);
      }
      button {
        padding: 10px 18px;
        border: none;
        border-radius: 18px;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button[hidden] {
        display: none;
      }
      ul {
        margin: 24px 0 0;
        padding: 16px 0 0 20px;
        border-top: 1px solid var(--border);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="../icons/icon-128.png" alt="" />
        <h1>Mark as Watched for YouTube</h1>
      </header>
      <p id="status"></p>
      <p id="detail"></p>
      <button id="grant" type="button" hidden></button>
      <button id="reload" type="button" hidden></button>
      <p id="result"></p>
      <ul id="features"></ul>
    </main>
    <script src="welcome.js"></script>
  </body>
</html>
